name: Verify synthetic portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify rules and access boundaries
        run: python -m unittest discover -s tests -v
      - name: Regenerate synthetic fixtures
        run: python scripts/generate_data.py
      - name: Regenerate demo evidence
        run: python portfolio.py demo --write-report
      - name: Check deterministic artifacts
        run: git diff --exit-code -- data/synthetic reports
      - name: Check public files and local links
        run: python scripts/check_publication.py
